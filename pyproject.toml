[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-agentic-ai-workbench"
version = "1.0.0"
description = "On-premise, privacy-first agentic AI workbench using open-weight models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tejas Trainer Projects" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "pillow>=10.2.0",
    "tiktoken>=0.6.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
reports = ["reportlab>=4.0.0"]
ocr = ["pytesseract>=0.3.10"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/ui/app.py" = ["E402"]
"src/api/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
